<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Ariscend</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #080808; color: #f6f3ed; font-family: Arial, sans-serif;
    }
    .login {
      width: min(420px, 90%); padding: 38px; background: #141414;
      border: 1px solid #292929; border-radius: 18px;
    }
    h1 { margin: 0; letter-spacing: 2px; }
    h1 span { color: #b59a60; }
    p { color: #aaa; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; font-size: 14px; }
    input {
      width: 100%; padding: 13px; border-radius: 9px;
      background: #090909; border: 1px solid #353535; color: white;
    }
    button {
      width: 100%; margin-top: 24px; padding: 13px; border: 0;
      border-radius: 9px; background: #b59a60; color: #111; font-weight: bold; cursor: pointer;
    }
    #message { color: #e76f51; font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <section class="login">
    <h1>ARIS<span>CEND</span></h1>
    <p>Inicia sesión y enfócate en construir tu progreso diario.</p>

    <form onsubmit="login(event)">
      <label for="email">Correo</label>
      <input id="email" type="email" placeholder="edwuard@email.com" required />

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="123456" required />

      <p id="message"></p>
      <button type="submit">Entrar a mi panel</button>
    </form>
  </section>

  <script>
    function login(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (password.length < 6) {
        document.getElementById("message").textContent =
          "La contraseña debe tener mínimo 6 caracteres.";
        return;
      }

      localStorage.setItem("ariscendUser", email);
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
