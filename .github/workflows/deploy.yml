name: Deploy Cloud Gallery to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permitir solo un despliegue concurrente a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ── Job 1: Validar ────────────────────────────────────────────────────────
  lint-and-validate:
    name: 🔍 Validate Static Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos necesarios
        run: |
          for f in index.html login.html auth.js; do
            if [ ! -f "$f" ]; then echo "❌ $f no encontrado"; exit 1; fi
            echo "✅ $f encontrado"
          done

  # ── Job 2: Desplegar en GitHub Pages ──────────────────────────────────────
  deploy-pages:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: lint-and-validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Directorio a publicar (al usar '.' se sube la raíz del repo)
          path: '.'

      - name: Desplegar artefacto en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4